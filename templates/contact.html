{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-8">Get In Touch</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Contact Information -->
        <div>
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Contact Information</h2>
            
            <div class="space-y-6">
                <div class="flex items-start">
                    <div class="bg-blue-100 p-3 rounded-full mr-4">
                        <i class="fas fa-envelope text-blue-600"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-800">Email</h3>
                        <p class="text-gray-600">pawan.rajput@example.com</p>
                    </div>
                </div>
                
                <div class="flex items-start">
                    <div class="bg-green-100 p-3 rounded-full mr-4">
                        <i class="fab fa-github text-green-600"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-800">GitHub</h3>
                        <a href="https://github.com/RajputPawan" class="text-blue-600 hover:underline" target="_blank">github.com/RajputPawan</a>
                    </div>
                </div>
                
                <div class="flex items-start">
                    <div class="bg-blue-600 p-3 rounded-full mr-4">
                        <i class="fab fa-linkedin-in text-white"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-800">LinkedIn</h3>
                        <a href="https://www.linkedin.com/in/pawan-rajput-b3918a251" class="text-blue-600 hover:underline" target="_blank">linkedin.com/in/pawan-rajput</a>
                    </div>
                </div>
                
                <div class="flex items-start">
                    <div class="bg-purple-100 p-3 rounded-full mr-4">
                        <i class="fas fa-map-marker-alt text-purple-600"></i>
                    </div>
                    <div>
                        <h3 class="font-medium text-gray-800">Location</h3>
                        <p class="text-gray-600">Kanpur, India</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Contact Form -->
        <div>
            <h2 class="text-2xl font-semibold text-gray-700 mb-6">Send Me a Message</h2>
            <form action="#" method="POST" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" id="name" name="name" required 
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                    <input type="text" id="subject" name="subject" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                    <textarea id="message" name="message" rows="4" required
                              class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                
                <button type="submit" 
                        class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
